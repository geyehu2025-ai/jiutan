name: Update real deal data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-real-deals
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch current public deals
        run: node scrape.mjs
      - name: Commit changed snapshot
        run: |
          git config user.name "jiutan-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update verified deal snapshot"
          git push
